name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ujuzify, POSTGRES_PASSWORD: ci, POSTGRES_DB: ujuzify }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ujuzify" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --cov=src --cov=api --cov-report=term-missing
        env:
          TEST_DATABASE_URL: postgresql://ujuzify:ci@localhost:5432/ujuzify
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci && npm run build
        working-directory: app
  docker:
    needs: [test, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ujuzify:ci .
      - name: Smoke test container
        run: |
          docker run -d --name u -p 8000:8000 -e API_KEY=ci-key ujuzify:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/ready && break || sleep 2; done
          curl -fs localhost:8000/ | grep -qi "<title>Ujuzify"
          curl -fs -X POST localhost:8000/api/v1/analyze -H 'content-type: application/json' \
            -d '{"skills":["Python","SQL"],"targetRole":"Data Engineer"}' | grep -q readinessScore
